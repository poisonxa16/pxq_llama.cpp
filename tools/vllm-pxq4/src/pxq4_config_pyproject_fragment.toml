# Fragment for pxq4-vllm/pyproject.toml -- the registration half only.
# Component B owns the rest of the file (build backend, deps, package dirs).
#
# The container image is often read-only in practice, so the shipping path is
# NOT `pip install`. It is:
#
#   <install-prefix>/site/
#       pxq4_vllm/...
#       pxq4_vllm-0.1.0.dist-info/METADATA          <- 3 lines, see below
#       pxq4_vllm-0.1.0.dist-info/entry_points.txt  <- pxq4_config_entry_points.txt
#
#   PYTHONPATH=<install-prefix>/site
#
# importlib.metadata.entry_points() scans .dist-info dirs on sys.path, so the
# entry point resolves with nothing installed. This pyproject stays in the repo
# for `pip install -e .` wherever a normal install is possible.
#
# Minimal METADATA that importlib.metadata accepts:
#   Metadata-Version: 2.1
#   Name: pxq4-vllm
#   Version: 0.1.0

[project.entry-points."vllm.general_plugins"]
pxq4 = "pxq4_vllm:register"
